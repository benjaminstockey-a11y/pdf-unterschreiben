# Admin-App für Android: baut bei Änderungen unter android/ eine signierte APK und legt sie
# ins Release „android“ (wird nie zum „latest“-Release, damit das Windows-Programm nicht stört).
name: Android-App

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signaturschlüssel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret ANDROID_KEYSTORE fehlt"; exit 1; fi
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/admin.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/admin.p12" >> "$GITHUB_ENV"

      - name: Bauen
        working-directory: android
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_KEY: ${{ secrets.REPORT_KEY }}
          APP_REPO: ${{ github.repository }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          export APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PDF-Admin.apk"

      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/android/PDF-Admin.apk"
          jq -n --arg v "$APP_VERSION" --arg u "$URL" '{version:$v, url:$u}' > version.json
          gh release delete android -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/android" 2>/dev/null || true
          gh release create android PDF-Admin.apk version.json --target "$GITHUB_SHA" --latest=false \
            --title "PDF Admin (Android) $APP_VERSION" --notes "Admin-App für Android. Auf dem Handy öffnen und installieren."
